services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: laravel-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: laravel-rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-lc", "ollama serve & sleep 5 && ollama pull nomic-embed-text && wait"]
